name: CD — TestFlight

on:
  push:
    branches:
      - release

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/artifacts
          key: spm-${{ hashFiles('Under_line.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Create API key file
        env:
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
        run: |
          test -n "$ALADIN_TTB_KEY"
          cat > Under_line/Network/AladinAPIKey.swift <<'SWIFT'
          enum AladinAPIKey {
              static let ttbKey = "__ALADIN_TTB_KEY__"
          }
          SWIFT
          ruby -pi -e 'gsub("__ALADIN_TTB_KEY__", ENV.fetch("ALADIN_TTB_KEY"))' Under_line/Network/AladinAPIKey.swift

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID:    ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8:    ${{ secrets.ASC_API_KEY_P8 }}
          MATCH_GIT_URL:     ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_ACTOR:   ${{ secrets.MATCH_GIT_ACTOR }}
          MATCH_GIT_TOKEN:   ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD:    ${{ secrets.MATCH_PASSWORD }}
          CI:                true
          FASTLANE_SKIP_UPDATE_CHECK: true
        run: bundle exec fastlane beta
